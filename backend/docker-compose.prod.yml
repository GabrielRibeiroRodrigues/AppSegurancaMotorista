# Produção na VPS (HTTP em IP:8000). Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
# O banco NÃO expõe porta para a internet (só a rede interna do compose).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copiloto}
      POSTGRES_USER: ${POSTGRES_USER:-copiloto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copiloto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Porta do host configurável (WEB_PORT no .env) para evitar conflito com
      # serviços já existentes na VPS. O container continua em 8000 internamente.
      - "${WEB_PORT:-8000}:8000"
    restart: unless-stopped

  # Sinalização WebRTC do vídeo ao vivo (Central de Operações).
  signaling:
    build: ../signaling
    environment:
      # Mesmo segredo do Django para validar o JWT das conexões (só operador assiste).
      SIGNALING_JWT_SECRET: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY no .env}
    ports:
      - "${SIGNALING_PORT:-4001}:4001"
    restart: unless-stopped

volumes:
  postgres_data:
